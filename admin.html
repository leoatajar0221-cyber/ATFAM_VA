<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leonard Live Chat — Admin</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#a81429">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#07090d;
    color:#f3f4f6;
    font-family:Arial,sans-serif;
    height:100vh;
    overflow:hidden;
}

.app{
    height:100vh;
    display:flex;
}

/* =========================
   SIDEBAR
========================= */

.sidebar{
    width:320px;
    min-width:320px;
    border-right:1px solid #262b34;
    background:#0b0e13;
    display:flex;
    flex-direction:column;
}

.brand{
    padding:22px;
    border-bottom:1px solid #262b34;
}

.brand h1{
    margin:0;
    font-size:20px;
}

.brand p{
    margin:6px 0 0;
    color:#8d96a5;
    font-size:13px;
}

.status{
    padding:12px 22px;
    border-bottom:1px solid #262b34;
    color:#8d96a5;
    font-size:12px;
}

.dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#35d07f;
    margin-right:7px;
}

.sessions{
    overflow:auto;
    flex:1;
}

.session{
    padding:16px 18px;
    border-bottom:1px solid #1c2027;
    cursor:pointer;
    position:relative;
}

.session:hover,
.session.active{
    background:#141922;
}

.session strong{
    display:block;
    font-size:14px;
    margin-bottom:5px;
}

.session small{
    color:#8d96a5;
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.session.unread{
    border-left:3px solid #ff1e2d;
}

.unread-badge{
    position:absolute;
    right:14px;
    top:16px;
    min-width:20px;
    height:20px;
    padding:0 6px;
    border-radius:20px;
    background:#ff1e2d;
    color:#fff;
    font-size:11px;
    font-weight:bold;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
   MAIN
========================= */

.main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.top{
    height:72px;
    min-height:72px;
    border-bottom:1px solid #262b34;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 24px;
}

.top-left{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:0;
}

.top h2{
    margin:0;
    font-size:18px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.mobile-menu{
    display:none;
    background:#10141b;
    border:1px solid #343b47;
    color:#fff;
    border-radius:8px;
    width:40px;
    height:40px;
    cursor:pointer;
}

.logout{
    border:1px solid #343b47;
    background:#10141b;
    color:#ddd;
    padding:9px 13px;
    border-radius:8px;
    cursor:pointer;
}

.messages{
    flex:1;
    overflow:auto;
    padding:28px;
}

.empty{
    height:100%;
    display:grid;
    place-items:center;
    color:#777f8d;
}

.msg{
    max-width:72%;
    margin:0 0 16px;
}

.msg.visitor{
    margin-right:auto;
}

.msg.admin{
    margin-left:auto;
}

.bubble{
    padding:12px 15px;
    border-radius:14px;
    background:#171c24;
    line-height:1.45;
    white-space:pre-wrap;
    word-break:break-word;
}

.admin .bubble{
    background:#7b111f;
}

.meta{
    font-size:10px;
    color:#707887;
    margin-top:5px;
}

.composer{
    border-top:1px solid #262b34;
    padding:16px;
    display:flex;
    gap:10px;
}

.composer textarea{
    flex:1;
    resize:none;
    background:#0e1218;
    color:#fff;
    border:1px solid #303744;
    border-radius:10px;
    padding:12px;
    min-height:46px;
    outline:none;
}

.composer textarea:focus{
    border-color:#a81429;
}

.send{
    background:#a81429;
    color:#fff;
    border:0;
    border-radius:10px;
    padding:0 20px;
    font-weight:700;
    cursor:pointer;
}

.send:disabled{
    opacity:.5;
}

/* =========================
   LOGIN
========================= */

.login{
    position:fixed;
    inset:0;
    background:#07090d;
    display:grid;
    place-items:center;
    z-index:5000;
}

.card{
    width:min(420px,92vw);
    background:#0d1118;
    border:1px solid #292f39;
    border-radius:16px;
    padding:28px;
    box-shadow:0 20px 70px #0008;
}

.card h1{
    margin-top:0;
}

.card p{
    color:#8d96a5;
    font-size:13px;
}

.field{
    width:100%;
    margin:8px 0;
    background:#090c11;
    color:#fff;
    border:1px solid #303744;
    border-radius:9px;
    padding:12px;
}

.login button{
    width:100%;
    margin-top:8px;
    padding:12px;
    border:0;
    border-radius:9px;
    background:#a81429;
    color:white;
    font-weight:700;
    cursor:pointer;
}

.error{
    color:#ff7c8d;
    font-size:13px;
    margin-top:10px;
}

.hidden{
    display:none!important;
}

/* =========================
   NOTIFICATION INDICATOR
========================= */

.notification-status{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#10141b;
    border:1px solid #303744;
    border-radius:10px;
    padding:10px 14px;
    font-size:12px;
    color:#8d96a5;
    z-index:4000;
    display:none;
}

.notification-status.show{
    display:block;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    body{
        overflow:hidden;
    }

    .sidebar{
        position:fixed;
        left:0;
        top:0;
        bottom:0;
        width:85%;
        max-width:340px;
        min-width:0;
        z-index:3000;
        transform:translateX(-100%);
        transition:transform .25s ease;
        box-shadow:20px 0 60px #000b;
    }

    .sidebar.mobile-open{
        transform:translateX(0);
    }

    .main{
        width:100%;
    }

    .top{
        height:64px;
        min-height:64px;
        padding:0 12px;
    }

    .mobile-menu{
        display:block;
    }

    .top h2{
        font-size:15px;
        max-width:180px;
    }

    .logout{
        padding:8px 10px;
        font-size:12px;
    }

    .messages{
        padding:16px 12px;
    }

    .msg{
        max-width:88%;
        margin-bottom:13px;
    }

    .bubble{
        padding:11px 13px;
        font-size:14px;
    }

    .composer{
        padding:10px;
        padding-bottom:max(10px, env(safe-area-inset-bottom));
    }

    .composer textarea{
        min-height:44px;
        max-height:120px;
    }

    .send{
        padding:0 16px;
    }
}
</style>
</head>

<body>

<!-- =========================
     LOGIN
========================= -->

<div id="login" class="login">

    <div class="card">

        <h1>Leonard Live Chat</h1>

        <p>
            Private admin dashboard.
            Sign in with your Supabase Auth account.
        </p>

        <input
            id="email"
            class="field"
            type="email"
            placeholder="Your email"
        >

        <input
            id="password"
            class="field"
            type="password"
            placeholder="Your password"
        >

        <button id="loginBtn">
            Sign in
        </button>

        <div id="loginError" class="error"></div>

    </div>

</div>


<!-- =========================
     APP
========================= -->

<div id="app" class="app hidden">

    <aside id="sidebar" class="sidebar">

        <div class="brand">
            <h1>Leonard Live Chat</h1>
            <p>Private conversation dashboard</p>
        </div>

        <div class="status">
            <span class="dot"></span>
            <span id="connectionText">Connecting...</span>
        </div>

        <div id="sessions" class="sessions"></div>

    </aside>


    <main class="main">

        <header class="top">

            <div class="top-left">

                <button
                    id="mobileMenu"
                    class="mobile-menu"
                    type="button"
                >
                    ☰
                </button>

                <h2 id="chatTitle">
                    Select a conversation
                </h2>

            </div>

            <button
                id="logout"
                class="logout"
                type="button"
            >
                Sign out
            </button>

        </header>


        <section
            id="messages"
            class="messages"
        >

            <div class="empty">
                Choose a visitor conversation.
            </div>

        </section>


        <form
            id="composer"
            class="composer hidden"
        >

            <textarea
                id="reply"
                placeholder="Type your reply..."
                maxlength="2000"
            ></textarea>

            <button
                class="send"
                type="submit"
            >
                Send
            </button>

        </form>

    </main>

</div>


<div
    id="notificationStatus"
    class="notification-status"
></div>


<script>

/* ==========================================================
   SUPABASE
========================================================== */

const SUPABASE_URL =
    'https://huscenzhjsvarylqqzxe.supabase.co';

const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_2G5AO_ZbXAw-C8rJKKdEMQ_r4XrmKJZ';

const client =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* ==========================================================
   VARIABLES
========================================================== */

let selectedSession = null;
let channel = null;

const unreadCounts = new Map();


/* ==========================================================
   ELEMENT HELPER
========================================================== */

const $ = id =>
    document.getElementById(id);


/* ==========================================================
   ERROR
========================================================== */

function showError(text){
    $('loginError').textContent = text;
}


/* ==========================================================
   ESCAPE HTML
========================================================== */

function escapeHtml(s){

    return String(s).replace(
        /[&<>'"]/g,
        c => ({
            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            "'":'&#39;',
            '"':'&quot;'
        }[c])
    );

}


function escapeAttr(s){

    return escapeHtml(s)
        .replace(/`/g,'&#96;');

}


/* ==========================================================
   NOTIFICATION SOUND
========================================================== */

let audioContext = null;

function playNotificationSound(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }

        if(audioContext.state === 'suspended'){
            audioContext.resume();
        }

        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();

        oscillator.type = 'sine';

        oscillator.frequency.setValueAtTime(
            880,
            audioContext.currentTime
        );

        oscillator.frequency.setValueAtTime(
            660,
            audioContext.currentTime + 0.12
        );

        gain.gain.setValueAtTime(
            0.001,
            audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            0.18,
            audioContext.currentTime + 0.02
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioContext.currentTime + 0.35
        );

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        oscillator.start();
        oscillator.stop(
            audioContext.currentTime + 0.35
        );

    }catch(error){

        console.log(
            'Notification sound unavailable:',
            error
        );

    }

}


/* ==========================================================
   BROWSER NOTIFICATION
========================================================== */

async function enableNotifications(){

    if(!('Notification' in window)){
        return;
    }

    if(Notification.permission === 'default'){

        try{

            await Notification.requestPermission();

        }catch(error){

            console.log(
                'Notification permission error:',
                error
            );

        }

    }

}


function notifyNewMessage(message, sessionId){

    /*
     * Sound
     */

    playNotificationSound();


    /*
     * Vibration on supported phones
     */

    if(
        navigator.vibrate &&
        document.hidden
    ){

        navigator.vibrate(
            [200,100,200]
        );

    }


    /*
     * Browser notification
     */

    if(
        'Notification' in window &&
        Notification.permission === 'granted'
    ){

        const notification =
            new Notification(
                'New visitor message',
                {
                    body:
                        message.length > 120
                            ? message.substring(0,120) + '...'
                            : message,

                    tag:
                        'visitor-' + sessionId,

                    renotify:true
                }
            );

        notification.onclick = () => {

            window.focus();

            selectSession(sessionId);

            notification.close();

        };

    }

}


/* ==========================================================
   MOBILE MENU
========================================================== */

$('mobileMenu').onclick = () => {

    $('sidebar')
        .classList
        .toggle('mobile-open');

};


function closeMobileMenu(){

    $('sidebar')
        .classList
        .remove('mobile-open');

}


/* ==========================================================
   INITIALIZE
========================================================== */

async function init(){

    const {
        data:{session}
    } = await client.auth.getSession();

    if(session){

        showApp();

    }

}


/* ==========================================================
   SHOW APP
========================================================== */

async function showApp(){

    $('login')
        .classList
        .add('hidden');

    $('app')
        .classList
        .remove('hidden');

    await enableNotifications();

    await loadSessions();

    subscribeAll();

    $('connectionText').textContent =
        'Live connection ready';

}


/* ==========================================================
   LOAD SESSIONS
========================================================== */

async function loadSessions(){

    const {
        data,
        error
    } = await client
        .from('messages')
        .select(
            'Session_id,message,created_at,sender'
        )
        .order(
            'created_at',
            {ascending:true}
        );


    if(error){

        $('sessions').innerHTML =
            '<div style="padding:20px;color:#ff7c8d;font-size:13px">' +
            escapeHtml(error.message) +
            '</div>';

        return;

    }


    const map = new Map();


    (data || []).forEach(m => {

        if(!map.has(m.Session_id)){

            map.set(
                m.Session_id,
                []
            );

        }

        map
            .get(m.Session_id)
            .push(m);

    });


    const entries =
        [...map.entries()].reverse();


    $('sessions').innerHTML =
        entries.length

        ?

        entries.map(
            ([sid,arr]) => {

                const last =
                    arr[arr.length - 1];

                const unread =
                    unreadCounts.get(sid) || 0;

                return `

                <div
                    class="session
                    ${sid === selectedSession ? 'active' : ''}
                    ${unread > 0 ? 'unread' : ''}"

                    data-session="${escapeAttr(sid)}"
                >

                    <strong>
                        Visitor ${escapeHtml(
                            sid.slice(0,8)
                        )}
                    </strong>

                    <small>
                        ${escapeHtml(last.message)}
                    </small>

                    ${
                        unread > 0
                        ?
                        `<span class="unread-badge">
                            ${unread}
                        </span>`
                        :
                        ''
                    }

                </div>

                `;

            }
        ).join('')

        :

        '<div style="padding:20px;color:#8d96a5;font-size:13px">No messages yet.</div>';


    document
        .querySelectorAll('.session')
        .forEach(el => {

            el.onclick = () =>
                selectSession(
                    el.dataset.session
                );

        });

}


/* ==========================================================
   SELECT SESSION
========================================================== */

async function selectSession(sid){

    selectedSession = sid;

    /*
     * Clear unread count
     */

    unreadCounts.delete(sid);

    await loadSessions();


    $('chatTitle').textContent =
        'Visitor ' + sid.slice(0,8);


    $('composer')
        .classList
        .remove('hidden');


    await loadMessages(sid);

    closeMobileMenu();

}


/* ==========================================================
   LOAD MESSAGES
========================================================== */

async function loadMessages(sid){

    const {
        data,
        error
    } = await client
        .from('messages')
        .select(
            'message,created_at,sender'
        )
        .eq(
            'Session_id',
            sid
        )
        .order(
            'created_at',
            {ascending:true}
        );


    if(error){

        $('messages').innerHTML =
            '<div class="empty">' +
            escapeHtml(error.message) +
            '</div>';

        return;

    }


    renderMessages(data || []);

}


/* ==========================================================
   RENDER MESSAGES
========================================================== */

function renderMessages(rows){

    if(!rows.length){

        $('messages').innerHTML =
            '<div class="empty">No messages.</div>';

        return;

    }


    $('messages').innerHTML =
        rows.map(
            m => `

            <div class="msg ${
                m.sender === 'admin'
                ? 'admin'
                : 'visitor'
            }">

                <div class="bubble">
                    ${escapeHtml(m.message)}
                </div>

                <div class="meta">
                    ${
                        m.sender === 'admin'
                        ? 'Leonard'
                        : 'Visitor'
                    }

                    •

                    ${new Date(
                        m.created_at
                    ).toLocaleString()}

                </div>

            </div>

            `
        ).join('');


    $('messages').scrollTop =
        $('messages').scrollHeight;

}


/* ==========================================================
   REALTIME
========================================================== */

function subscribeAll(){

    if(channel){

        client.removeChannel(channel);

    }


    channel =
        client
            .channel('admin-live-chat')

            .on(
                'postgres_changes',
                {
                    event:'INSERT',
                    schema:'public',
                    table:'messages'
                },

                payload => {

                    const message =
                        payload.new;


                    /*
                     * Visitor message
                     */

                    if(
                        message.sender === 'visitor'
                    ){

                        const sid =
                            message.Session_id;


                        /*
                         * Increase unread count
                         * if Leonard isn't currently
                         * viewing this conversation.
                         */

                        if(
                            sid !== selectedSession
                        ){

                            const current =
                                unreadCounts.get(sid) || 0;

                            unreadCounts.set(
                                sid,
                                current + 1
                            );

                        }


                        /*
                         * Notify Leonard
                         */

                        notifyNewMessage(
                            message.message,
                            sid
                        );

                    }


                    /*
                     * Refresh conversation list
                     */

                    loadSessions();


                    /*
                     * If currently viewing this
                     * conversation, update messages.
                     */

                    if(
                        selectedSession &&
                        message.Session_id ===
                        selectedSession
                    ){

                        loadMessages(
                            selectedSession
                        );

                    }

                }
            )

            .subscribe(
                state => {

                    console.log(
                        'Realtime status:',
                        state
                    );


                    if(
                        state === 'SUBSCRIBED'
                    ){

                        $('connectionText')
                            .textContent =
                            'Live connection ready';

                    }

                    else if(
                        state === 'CHANNEL_ERROR'
                    ){

                        $('connectionText')
                            .textContent =
                            'Connection error';

                    }

                    else if(
                        state === 'TIMED_OUT'
                    ){

                        $('connectionText')
                            .textContent =
                            'Connection timed out';

                    }

                }
            );

}


/* ==========================================================
   LOGIN
========================================================== */

$('loginBtn').onclick =
    async () => {

        showError('');

        const {
            error
        } =
            await client.auth.signInWithPassword({

                email:
                    $('email').value.trim(),

                password:
                    $('password').value

            });


        if(error){

            showError(
                error.message
            );

            return;

        }


        /*
         * User interaction allows
         * notification sound to initialize.
         */

        playNotificationSound();


        await showApp();

    };


/* ==========================================================
   SIGN OUT
========================================================== */

$('logout').onclick =
    async () => {

        await client.auth.signOut();

        location.reload();

    };


/* ==========================================================
   SEND ADMIN REPLY
========================================================== */

$('composer').onsubmit =
    async e => {

        e.preventDefault();


        if(!selectedSession){
            return;
        }


        const text =
            $('reply')
                .value
                .trim();


        if(!text){
            return;
        }


        const {
            data:{user}
        } =
            await client.auth.getUser();


        if(!user){

            alert(
                'Please sign in again.'
            );

            return;

        }


        const sendButton =
            document.querySelector(
                '.send'
            );


        sendButton.disabled = true;


        const {
            error
        } =
            await client
                .from('messages')
                .insert({

                    Session_id:
                        selectedSession,

                    sender:
                        'admin',

                    message:
                        text

                });


        sendButton.disabled = false;


        if(error){

            alert(
                'Could not send reply: ' +
                error.message
            );

            return;

        }


        $('reply').value = '';

        await loadMessages(
            selectedSession
        );

        await loadSessions();

    };


/* ==========================================================
   ENTER TO SEND
========================================================== */

$('reply').addEventListener(
    'keydown',
    e => {

        /*
         * Enter sends.
         * Shift + Enter creates a new line.
         */

        if(
            e.key === 'Enter' &&
            !e.shiftKey
        ){

            e.preventDefault();

            $('composer').requestSubmit();

        }

    }
);


/* ==========================================================
   START
========================================================== */

init();

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
            .then(() => {
                console.log('Service worker registered successfully');
            })
            .catch(error => {
                console.error('Service worker registration failed:', error);
            });
    });
}

</script>

</body>
</html>
