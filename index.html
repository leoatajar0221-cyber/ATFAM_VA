<!DOCTYPE html>

    <meta charset="UTF-8">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBg: '#050505',
                        cardBg: '#101010',
                        accentRed: '#ff1e2d',
                        accentRedHover: '#e01220',
                        textMuted: '#a3a3a3'
                    }
                }
            }

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #050505;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* Interactive Canvas Moving Background */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            pointer-events: none;
            background-color: #050505;
        }

        /* Ambient Glowing Red Orbs */
        .bg-glow-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .red-orb {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(255, 30, 45, 0.28) 0%, rgba(255, 30, 45, 0) 70%);
            border-radius: 50%;
            filter: blur(80px);
            animation: moveOrb 12s infinite alternate ease-in-out;
        }

        .orb-1 { top: -15%; left: -10%; animation-duration: 14s; }
        .orb-2 { bottom: -15%; right: -10%; animation-duration: 18s; animation-delay: -3s; }
        .orb-3 { top: 40%; left: 45%; transform: translate(-50%, -50%); width: 800px; height: 800px; animation: pulseOrb 7s infinite alternate ease-in-out; }

        @keyframes moveOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(220px, 160px) scale(1.35); }
        }

        @keyframes pulseOrb {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.4); opacity: 1; }
        }

        .glow-red {
            box-shadow: 0 0 50px rgba(255, 30, 45, 0.25);
        }
        .text-glow {
            text-shadow: 0 0 25px rgba(255, 30, 45, 0.5);
        }
        .view-section {
            display: none;
        }
        .view-section.active {
            display: block;
        }
    </style>
</head>
<body class="bg-darkBg text-white selection:bg-accentRed selection:text-white">
