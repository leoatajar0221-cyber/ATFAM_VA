<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leonard Atajar — Live Chat Test</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{margin:0;background:#050505;color:#fff;font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.demo{width:min(900px,94vw);padding:40px}.card{background:rgba(16,16,16,.94);border:1px solid rgba(255,255,255,.1);border-radius:28px;padding:34px;text-align:center}.accent{color:#ff1e2d}
#robot-button{position:fixed;right:28px;bottom:28px;width:64px;height:64px;border-radius:50%;border:2px solid #ff1e2d;background:#090909;color:#fff;font-size:27px;cursor:pointer;box-shadow:0 0 30px rgba(255,30,45,.45);z-index:1001}
#chat-window{position:fixed;right:28px;bottom:105px;width:min(390px,calc(100vw - 32px));height:590px;background:#0b0b0b;border:1px solid rgba(255,30,45,.55);border-radius:24px;box-shadow:0 0 45px rgba(255,30,45,.25);display:none;flex-direction:column;overflow:hidden;z-index:1000}
#chat-window.open{display:flex}.chat-header{padding:18px 18px 15px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:space-between}.chat-title{font-weight:800}.online{font-size:11px;color:#9ca3af;margin-top:3px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;margin-right:5px}.close{background:none;border:0;color:#aaa;font-size:20px;cursor:pointer}.messages{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}.msg{max-width:82%;padding:11px 13px;border-radius:16px;font-size:13px;line-height:1.45;word-wrap:break-word}.visitor{align-self:flex-end;background:#ff1e2d;color:#fff;border-bottom-right-radius:5px}.admin{align-self:flex-start;background:#181818;border:1px solid rgba(255,255,255,.08);border-bottom-left-radius:5px}.system{align-self:center;max-width:92%;font-size:11px;color:#8f8f8f;text-align:center}.composer{border-top:1px solid rgba(255,255,255,.1);padding:12px;display:flex;gap:8px}.composer input{flex:1;background:#151515;border:1px solid rgba(255,255,255,.12);border-radius:14px;color:#fff;padding:12px;outline:none}.composer input:focus{border-color:#ff1e2d}.composer button{width:46px;border:0;border-radius:14px;background:#ff1e2d;color:#fff;cursor:pointer}.status{padding:0 14px 8px;font-size:10px;color:#777}.configured{color:#22c55e}.not-configured{color:#f59e0b}
</style>
</head>
<body>
<div class="demo"><div class="card"><div class="text-sm uppercase tracking-widest text-gray-500 mb-3">Portfolio Live Chat Test</div><h1 class="text-4xl font-extrabold mb-4">Chat with <span class="accent">Leonard</span></h1><p class="text-gray-400 max-w-xl mx-auto">This is the local-test version of the live chat interface. Click the red robot button to open it. Your portfolio itself is not changed by this test file.</p></div></div>

<button id="robot-button" aria-label="Open live chat">🤖</button>
<div id="chat-window">
  <div class="chat-header"><div><div class="chat-title">Leonard's Live Chat</div><div class="online"><span class="dot"></span>Online • Portfolio Support</div></div><button class="close" id="close-chat" aria-label="Close">&times;</button></div>
  <div id="chat-messages" class="messages"></div>
  <div id="connection-status" class="status not-configured">Supabase not configured — local preview mode</div>
  <div class="composer"><input id="user-input" type="text" maxlength="1000" placeholder="Type your message..." autocomplete="off"><button id="send-button" aria-label="Send"><i class="fa-solid fa-paper-plane"></i></button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ==========================================================
   LEONARD LIVE CHAT — VISITOR
   Anonymous Supabase authentication + Realtime
   ========================================================== */

const SUPABASE_URL = 'https://huscenzhjsvarylqqzxe.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_2G5AO_ZbXAw-C8rJKKdEMQ_r4XrmKJZ';

const configured =
    SUPABASE_URL.startsWith('http') &&
    SUPABASE_PUBLISHABLE_KEY.startsWith('sb_publishable_');

const supabaseClient = configured
    ? window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      )
    : null;


/* ==========================================================
   ELEMENTS
   ========================================================== */

const chatWindow = document.getElementById('chat-window');
const robotButton = document.getElementById('robot-button');
const closeChat = document.getElementById('close-chat');
const messages = document.getElementById('chat-messages');
const input = document.getElementById('user-input');
const sendButton = document.getElementById('send-button');
const status = document.getElementById('connection-status');


/* ==========================================================
   SESSION
   ========================================================== */

let sessionId = null;
let realtimeChannel = null;


/* ==========================================================
   DISPLAY MESSAGE
   ========================================================== */

function addMessage(text, type) {
    const div = document.createElement('div');

    div.className = 'msg ' + type;
    div.textContent = text;

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}


/* ==========================================================
   WELCOME MESSAGE
   ========================================================== */

function showWelcome() {
    if (!messages.children.length) {
        addMessage(
            "Hi! 👋 Thanks for visiting my portfolio. You’re now in Leonard’s live chat. Send me a message and I’ll get back to you.",
            'admin'
        );
    }
}


/* ==========================================================
   CHAT OPEN / CLOSE
   ========================================================== */

robotButton.onclick = () => {
    chatWindow.classList.add('open');
    showWelcome();
    input.focus();
};

closeChat.onclick = () => {
    chatWindow.classList.remove('open');
};


/* ==========================================================
   ANONYMOUS SUPABASE LOGIN
   ========================================================== */

async function initializeVisitor() {

    if (!supabaseClient) {
        status.textContent =
            'Preview mode — Supabase is not configured.';
        status.className =
            'status not-configured';

        showWelcome();
        return;
    }

    status.textContent = 'Connecting…';
    status.className = 'status';


    try {

        /*
         * Check whether this browser already has
         * an authenticated anonymous session.
         */

        let { data: sessionData, error: sessionError } =
            await supabaseClient.auth.getSession();

        if (sessionError) {
            throw sessionError;
        }


        /*
         * If there is no session, create an
         * anonymous Supabase user.
         */

        if (!sessionData.session) {

            const { data, error } =
                await supabaseClient.auth.signInAnonymously();

            if (error) {
                throw error;
            }

            sessionData.session = data.session;
        }


        /*
         * Use the Supabase anonymous user's UUID
         * as the Session_id.
         */

        sessionId =
            sessionData.session.user.id;


        /*
         * Save the ID locally so we can see it
         * during testing/debugging.
         */

        localStorage.setItem(
            'leo_live_chat_session_id',
            sessionId
        );


        status.textContent =
            'Connected • starting live chat…';

        status.className =
            'status configured';


        /*
         * Start Realtime after authentication.
         */

        connectRealtime();


    } catch (error) {

        console.error(
            'Anonymous authentication error:',
            error
        );

        status.textContent =
            'Connection error: ' + error.message;

        status.className =
            'status not-configured';
    }
}


/* ==========================================================
   SEND MESSAGE
   ========================================================== */

async function sendMessage() {

    const text = input.value.trim();

    if (!text) return;

    if (!supabaseClient || !sessionId) {

        status.textContent =
            'Chat is not connected yet.';

        status.className =
            'status not-configured';

        return;
    }


    /*
     * Show visitor message immediately.
     */

    addMessage(text, 'visitor');

    input.value = '';

    sendButton.disabled = true;


    try {

        const { error } =
            await supabaseClient
                .from('messages')
                .insert({
                    Session_id: sessionId,
                    sender: 'visitor',
                    message: text
                });


        if (error) {
            throw error;
        }


        status.textContent =
            'Message sent • waiting for Leonard';

        status.className =
            'status configured';


    } catch (error) {

        console.error(
            'Message insert error:',
            error
        );

        status.textContent =
            'Could not save message: ' +
            error.message;

        status.className =
            'status not-configured';
    }


    sendButton.disabled = false;
}


/* ==========================================================
   REALTIME
   ========================================================== */

function connectRealtime() {

    if (!supabaseClient || !sessionId) {
        return;
    }


    /*
     * Remove an old channel if one exists.
     */

    if (realtimeChannel) {
        supabaseClient.removeChannel(
            realtimeChannel
        );
    }


    /*
     * IMPORTANT:
     * Your database column is Session_id.
     * The Realtime filter must use Session_id,
     * not session_id.
     */

    realtimeChannel =
        supabaseClient
            .channel(
                'live-chat-' + sessionId
            )
            .on(
                'postgres_changes',
                {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages',
                    filter:
                        'Session_id=eq.' +
                        sessionId
                },
                (payload) => {

                    console.log(
                        'Realtime message received:',
                        payload
                    );


                    /*
                     * Only display messages sent
                     * by Leonard/admin.
                     */

                    if (
                        payload.new &&
                        payload.new.sender === 'admin'
                    ) {

                        addMessage(
                            payload.new.message,
                            'admin'
                        );

                        status.textContent =
                            'Leonard replied • Live';

                        status.className =
                            'status configured';
                    }
                }
            )
            .subscribe((state) => {

                console.log(
                    'Realtime status:',
                    state
                );


                if (state === 'SUBSCRIBED') {

                    status.textContent =
                        'Live connection ready';

                    status.className =
                        'status configured';

                } else if (
                    state === 'CHANNEL_ERROR'
                ) {

                    status.textContent =
                        'Live connection error';

                    status.className =
                        'status not-configured';

                } else if (
                    state === 'TIMED_OUT'
                ) {

                    status.textContent =
                        'Live connection timed out';

                    status.className =
                        'status not-configured';
                }
            });
}


/* ==========================================================
   BUTTONS / ENTER KEY
   ========================================================== */

sendButton.onclick = sendMessage;

input.addEventListener(
    'keydown',
    (e) => {

        if (e.key === 'Enter') {
            e.preventDefault();
            sendMessage();
        }

    }
);


/* ==========================================================
   START
   ========================================================== */

showWelcome();
initializeVisitor();

</script>

</body>
</html>
